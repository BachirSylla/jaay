# Weekly encrypted backup of the Supabase database (pg_dump), kept 30 days as an artifact.
#
# Disabled until the repository variable BACKUP_ENABLED is set to "true" (Settings →
# Secrets and variables → Actions → Variables). Needs two repository secrets:
#   SUPABASE_DB_URL     Postgres connection string (Supabase → Connect → Session pooler),
#                       password included. Never committed.
#   BACKUP_PASSPHRASE   long random passphrase: the dump is encrypted with it (AES-256)
#                       because artifacts of a public repository can be downloaded by any
#                       GitHub user. Keep it in a password manager: without it the backups
#                       cannot be read.
# Procedure and restore steps: README.md, "Sauvegardes".

name: Database backup

on:
  schedule:
    - cron: "0 2 * * 0" # every Sunday at 02:00 UTC (02:00 in Dakar)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Missing SUPABASE_DB_URL or BACKUP_PASSPHRASE repository secret."
            exit 1
          fi

      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Dump and encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Business data (public), accounts (auth) and file metadata (storage).
          # The photo files themselves stay in Supabase Storage (not in this dump).
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage \
            --file="jaay-$STAMP.dump"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "jaay-$STAMP.dump.gpg" "jaay-$STAMP.dump"
          rm -f "jaay-$STAMP.dump"
          ls -lh "jaay-$STAMP.dump.gpg"

      - name: Keep 30 days
        uses: actions/upload-artifact@v4
        with:
          name: jaay-backup-${{ env.STAMP }}
          path: jaay-${{ env.STAMP }}.dump.gpg
          retention-days: 30
          if-no-files-found: error
